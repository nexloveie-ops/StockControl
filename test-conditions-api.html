<!DOCTYPE html>
<html>
<head>
  <title>测试成色API</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .result {
      background: #f0f9ff;
      border: 1px solid #0ea5e9;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 2px solid #0ea5e9;
      border-radius: 6px;
      margin-top: 10px;
    }
    .info {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>🎨 测试成色API</h1>
  
  <div class="info">
    <strong>API端点：</strong> GET /api/merchant/conditions
  </div>
  
  <button onclick="testAPI()" style="padding: 10px 20px; background: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px;">
    🔄 测试API
  </button>
  
  <div id="result" class="result" style="display: none;">
    <h3>API响应：</h3>
    <pre id="apiResponse" style="background: white; padding: 10px; border-radius: 4px; overflow-x: auto;"></pre>
    
    <h3>成色下拉框：</h3>
    <select id="conditionSelect">
      <option value="">选择成色...</option>
    </select>
  </div>
  
  <script>
    async function testAPI() {
      const resultDiv = document.getElementById('result');
      const responseDiv = document.getElementById('apiResponse');
      const select = document.getElementById('conditionSelect');
      
      try {
        console.log('🔄 调用API: /api/merchant/conditions');
        
        const response = await fetch('/api/merchant/conditions');
        const result = await response.json();
        
        console.log('📋 API响应:', result);
        
        // 显示原始响应
        responseDiv.textContent = JSON.stringify(result, null, 2);
        
        // 填充下拉框
        if (result.success && result.data) {
          select.innerHTML = '<option value="">选择成色...</option>';
          
          result.data.forEach(condition => {
            const option = new Option(condition.name, condition.code);
            select.add(option);
          });
          
          console.log(`✅ 已加载 ${result.data.length} 个成色选项`);
        }
        
        resultDiv.style.display = 'block';
        
      } catch (error) {
        console.error('❌ 错误:', error);
        responseDiv.textContent = '错误: ' + error.message;
        resultDiv.style.display = 'block';
      }
    }
  </script>
</body>
</html>
