<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CELESTIA TRADE PARTNERS LIMITED</title>
  <script src="/i18n.js"></script>
  <script src="/auto-translate.js"></script>
  <script src="/auth-guard.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 1000px;
      width: 100%;
      display: flex;
      min-height: 600px;
    }
    
    .login-left {
      flex: 1;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 80px 40px 60px 40px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      position: relative;
      overflow: hidden;
    }
    
    .login-left::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      animation: pulse 15s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    
    .company-name {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 50px;
      margin-top: 0;
      line-height: 1.2;
      position: relative;
      z-index: 1;
      letter-spacing: 1px;
    }
    
    .features {
      position: relative;
      z-index: 1;
    }
    
    .feature-item {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      opacity: 0.95;
    }
    
    .feature-icon {
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 15px;
      font-size: 20px;
    }
    
    .feature-text {
      font-size: 15px;
    }
    
    .login-right {
      flex: 1;
      padding: 60px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .login-header {
      margin-bottom: 40px;
    }
    
    .login-title {
      font-size: 32px;
      font-weight: 700;
      color: #333;
      margin-bottom: 10px;
    }
    
    .login-subtitle {
      font-size: 14px;
      color: #666;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    
    .form-input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 15px;
      transition: all 0.3s;
      outline: none;
    }
    
    .form-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    
    .form-options {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .remember-me {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #666;
    }
    
    .remember-me input {
      margin-right: 8px;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    
    .login-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    
    .login-button:active {
      transform: translateY(0);
    }
    
    .login-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
      border-left: 4px solid #c33;
    }
    
    .error-message.show {
      display: block;
      animation: slideDown 0.3s ease-out;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @media (max-width: 768px) {
      .login-container {
        flex-direction: column;
      }
      
      .login-left {
        padding: 40px 30px;
        min-height: 300px;
      }
      
      .company-name {
        font-size: 24px;
      }
      
      .login-right {
        padding: 40px 30px;
      }
      
      .login-title {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <!-- 左侧品牌区域 -->
    <div class="login-left">
      <h1 class="company-name" data-i18n="company.name">
        CELESTIA TRADE<br>PARTNERS LIMITED
      </h1>
      
      <div class="features">
        <div class="feature-item">
          <div class="feature-icon">📦</div>
          <div class="feature-text" data-i18n="feature.inventory">智能库存管理</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">💰</div>
          <div class="feature-text" data-i18n="feature.sales">销售数据分析</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">🔄</div>
          <div class="feature-text" data-i18n="feature.supply">供应链协同</div>
        </div>
        <div class="feature-item">
          <div class="feature-icon">📊</div>
          <div class="feature-text" data-i18n="feature.reports">实时报表统计</div>
        </div>
      </div>
    </div>
    
    <!-- 右侧登录表单 -->
    <div class="login-right">
      <div class="login-header">
        <h2 class="login-title" data-i18n="login.title">欢迎回来</h2>
        <p class="login-subtitle" data-i18n="login.subtitle">请登录您的账户以继续</p>
      </div>
      
      <div class="error-message" id="errorMessage"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username" data-i18n="login.username">用户名或邮箱</label>
          <input 
            type="text" 
            id="username" 
            class="form-input" 
            data-i18n-placeholder="login.username"
            placeholder="请输入用户名或邮箱"
            required
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label class="form-label" for="password" data-i18n="login.password">密码</label>
          <input 
            type="password" 
            id="password" 
            class="form-input" 
            data-i18n-placeholder="login.password"
            placeholder="请输入密码"
            required
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe">
            <span data-i18n="login.rememberMe">记住我</span>
          </label>
        </div>
        
        <button type="submit" class="login-button" id="loginButton" data-i18n="login.button">
          登录
        </button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = '/api';
    
    // 显示错误消息
    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.textContent = message;
      errorDiv.classList.add('show');
      
      setTimeout(() => {
        errorDiv.classList.remove('show');
      }, 5000);
    }
    
    // 登录处理
    async function handleLogin(username, password) {
      const loginButton = document.getElementById('loginButton');
      loginButton.disabled = true;
      loginButton.textContent = i18n.t('loading');
      
      try {
        // 调用后端登录API
        const response = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });
        
        const result = await response.json();
        
        if (result.success && result.data && result.data.user) {
          const user = result.data.user;
          
          // 保存登录信息到localStorage
          localStorage.setItem('username', user.username);
          localStorage.setItem('userRole', user.role);
          localStorage.setItem('userId', user._id);
          localStorage.setItem('userEmail', user.email);
          localStorage.setItem('loginTime', new Date().toISOString());
          
          // 保存完整用户信息
          localStorage.setItem('userInfo', JSON.stringify(user));
          
          // 根据用户角色跳转到对应的主页
          const homePage = AuthGuard.getRoleHomePage(user.role);
          window.location.href = homePage;
        } else {
          showError(result.error || i18n.t('login.error.invalid'));
          loginButton.disabled = false;
          loginButton.textContent = i18n.t('login.button');
        }
      } catch (error) {
        console.error('登录错误:', error);
        showError(i18n.t('login.error.failed'));
        loginButton.disabled = false;
        loginButton.textContent = i18n.t('login.button');
      }
    }
    
    // 表单提交
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError(i18n.t('login.error.empty'));
        return;
      }
      
      await handleLogin(username, password);
    });
    
    // 检查是否已登录 - 已禁用自动跳转
    // 用户访问登录页面时应该能够看到登录表单，而不是自动跳转
    window.addEventListener('DOMContentLoaded', () => {
      // 不再自动跳转，让用户可以正常访问登录页面
    });
  </script>
</body>
</html>
